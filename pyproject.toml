[project]
name = "browseragent"
version = "0.1.0"
description = "Two-agent web automation app: CrewAI planner/executor over the agent-browser CLI, FastAPI backend, GLM LLM."
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.15.30",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.6.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
